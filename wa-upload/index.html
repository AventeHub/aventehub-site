<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send a file · Avente Hub WhatsApp</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Marcellus&display=swap">
<style>
:root{--bg:#1B1512;--card:#2C1E14;--ink:#F4EDDD;--muted:#B7A48E;--gold:#C9A227;--goldl:#F3E2A0;--line:rgba(201,162,39,.25);--ok:#7fbf8e;--bad:#e07a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,"Avenir Next","Segoe UI",sans-serif;font-size:17px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:Marcellus,Georgia,serif;font-weight:400;color:var(--goldl);font-size:26px;margin:0 0 4px}
.to{color:var(--muted);margin:0 0 20px}
.pick{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--card)}
.pick:hover{border-color:var(--gold)}
.pick b{color:var(--goldl);font-weight:500}
.pick input{display:none}
#prev{margin-top:14px;text-align:center}
#prev img{max-width:100%;max-height:300px;border-radius:10px}
textarea{width:100%;margin-top:14px;min-height:70px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
button{margin-top:14px;width:100%;border:0;background:var(--gold);color:#1A1008;border-radius:999px;padding:13px;font:inherit;font-weight:600;font-size:18px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#msg{margin-top:14px;text-align:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.small{color:var(--muted);font-size:14px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<main>
<h1>📎 Send on WhatsApp</h1>
<p class="to" id="to">from Avente Hub · +1 (813) 377-8225</p>
<label class="pick"><input type="file" id="file" accept="image/*,video/mp4,video/3gpp,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip"><b>Choose a photo, video or file</b><br><span class="small">Photos are resized to send fast · max about 4 MB</span></label>
<div id="prev"></div>
<textarea id="cap" placeholder="Message with it (optional)"></textarea>
<button id="send" disabled>Send</button>
<div id="msg"></div>
<p class="small">Opened from the CEO Dashboard. Each link sends once.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), task=q.get('task')||'', key=q.get('key')||'', who=q.get('name')||'', num=q.get('to')||'';
  var fileEl=document.getElementById('file'), prev=document.getElementById('prev'), btn=document.getElementById('send'), msg=document.getElementById('msg'), blob=null, fname='file';
  if(who||num) document.getElementById('to').textContent='To '+(who||('+'+num))+(who&&num?' · +'+num:'')+' · from +1 (813) 377-8225';
  if(!task||!key){msg.className='bad';msg.textContent='This link is not complete. Open it again from the CEO Dashboard (📎).';fileEl.disabled=true;}
  function shrink(f){
    return new Promise(function(done){
      if(!/^image\//.test(f.type)||f.type==='image/gif'){done({b:f,n:f.name,t:f.type||'application/octet-stream'});return;}
      var img=new Image(), url=URL.createObjectURL(f);
      img.onload=function(){
        var max=2048, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
        if(s===1&&f.size<3.5e6&&/jpeg|png/.test(f.type)){URL.revokeObjectURL(url);done({b:f,n:f.name,t:f.type});return;}
        var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
        c.toBlob(function(b){done({b:b,n:f.name.replace(/\.\w+$/,'')+'.jpg',t:'image/jpeg'});},'image/jpeg',0.85);
      };
      img.onerror=function(){URL.revokeObjectURL(url);done({b:f,n:f.name,t:f.type});};
      img.src=url;
    });
  }
  fileEl.onchange=function(){
    var f=fileEl.files[0]; if(!f) return; msg.textContent=''; btn.disabled=true; prev.textContent='Preparing…';
    shrink(f).then(function(r){
      blob=r.b; fname=r.n; prev.innerHTML='';
      if(/^image\//.test(r.t)){var i=document.createElement('img');i.src=URL.createObjectURL(blob);prev.appendChild(i);}
      else prev.textContent='📄 '+fname;
      if(blob.size>4.3e6){msg.className='bad';msg.textContent='This file is '+(blob.size/1e6).toFixed(1)+' MB. The limit is about 4 MB.';return;}
      btn.disabled=false; btn.dataset.type=r.t;
    });
  };
  btn.onclick=function(){
    if(!blob) return; btn.disabled=true; btn.textContent='Sending…'; msg.className=''; msg.textContent='';
    fetch('/api/wa-upload/',{method:'POST',body:blob,headers:{'Content-Type':btn.dataset.type||'application/octet-stream','x-task':task,'x-key':key,
      'x-name':encodeURIComponent(fname),'x-caption':encodeURIComponent(document.getElementById('cap').value.trim())}})
    .then(function(r){return r.json().catch(function(){return {ok:false,error:'HTTP '+r.status};});})
    .then(function(j){
      if(j.ok){msg.className='ok';msg.textContent='✅ Sent. It shows in the Dashboard chat within a minute. You can close this tab.';btn.textContent='Sent';fileEl.disabled=true;}
      else {msg.className='bad';msg.textContent='⚠️ Not sent: '+(j.error||'error');btn.textContent='Send';btn.disabled=/already used|expired|not valid/.test(j.error||'');}
    }).catch(function(){msg.className='bad';msg.textContent='⚠️ No connection. Try again.';btn.textContent='Send';btn.disabled=false;});
  };
})();
</script>
</body>
</html>
